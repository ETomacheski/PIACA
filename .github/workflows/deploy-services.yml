name: Deploy Services

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'piaca-backend/**'
      - 'docker-compose.yml'
      - 'scripts/deploy-ec2.sh'
      - 'scripts/sync-env-from-ssm.sh'
      - '.github/workflows/deploy-services.yml'
  workflow_dispatch:

concurrency:
  group: deploy-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Validar configuracao minima (dev)
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "Secret AWS_ACCESS_KEY_ID nao configurado"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Secret AWS_SECRET_ACCESS_KEY nao configurado"
            exit 1
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy servicos em development via SSM
        run: |
          APP_DIR="${{ secrets.DEV_EC2_APP_DIR }}"
          if [ -z "$APP_DIR" ]; then
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
          fi
          if [ -z "$APP_DIR" ]; then
            APP_DIR="/home/ec2-user/app"
          fi

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=piaca-dev-ec2" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Instancia dev (tag Name=piaca-dev-ec2) nao encontrada em estado running"
            exit 1
          fi

          echo "Aguardando instancia $INSTANCE_ID ficar Online no SSM..."
          for i in $(seq 1 20); do
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)

            if [ "$PING_STATUS" = "Online" ]; then
              echo "Instancia $INSTANCE_ID esta Online no SSM."
              break
            fi

            if [ "$i" -eq 20 ]; then
              echo "Instancia $INSTANCE_ID nao ficou Online no SSM. Verifique IAM Role (AmazonSSMManagedInstanceCore), SSM Agent e conectividade de saida da EC2."
              exit 1
            fi

            sleep 15
          done

          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cat > ssm-commands.json <<'EOF'
          {"commands":[
            "set -euo pipefail",
            "if [ -z \"${HOME:-}\" ]; then HOME=$(getent passwd \"$(id -u)\" | cut -d: -f6 || true); export HOME; fi",
            "if [ -z \"${HOME:-}\" ]; then HOME=/tmp; export HOME; fi",
            "mkdir -p \"$HOME\"",
            "LOCK_FILE=/tmp/piaca-deploy.lock",
            "exec 9>\"$LOCK_FILE\"",
            "flock -w 600 9 || { echo \"Nao foi possivel adquirir lock de deploy\"; exit 1; }",
            "APP_DIR='__APP_DIR__'",
            "REPO_URL='__REPO_URL__'",
            "TARGET_BRANCH='develop'",
            "PARENT_DIR=$(dirname \"$APP_DIR\")",
            "if [ ! -d \"$APP_DIR/.git\" ]; then mkdir -p \"$PARENT_DIR\" && git clone \"$REPO_URL\" \"$APP_DIR\"; fi",
            "cd \"$APP_DIR\"",
            "git config --local --replace-all safe.directory \"$APP_DIR\"",
            "git remote set-url origin \"$REPO_URL\"",
            "git fetch origin \"$TARGET_BRANCH\"",
            "git checkout -B \"$TARGET_BRANCH\" \"origin/$TARGET_BRANCH\"",
            "if [ ! -f \"scripts/deploy-ec2.sh\" ]; then cd /tmp && rm -rf \"$APP_DIR\" && mkdir -p \"$PARENT_DIR\" && git clone --branch \"$TARGET_BRANCH\" --single-branch \"$REPO_URL\" \"$APP_DIR\" && cd \"$APP_DIR\"; fi",
            "if [ ! -f \"scripts/deploy-ec2.sh\" ]; then echo \"scripts/deploy-ec2.sh nao encontrado em $APP_DIR\" && ls -la \"$APP_DIR\" && exit 1; fi",
            "chmod +x scripts/deploy-ec2.sh scripts/sync-env-from-ssm.sh",
            "./scripts/deploy-ec2.sh services develop \"$APP_DIR\" docker-compose.yml dev"
          ]}
          EOF

          ESCAPED_APP_DIR=${APP_DIR//&/\\&}
          ESCAPED_REPO_URL=${REPO_URL//&/\\&}
          sed -i "s|__APP_DIR__|$ESCAPED_APP_DIR|g; s|__REPO_URL__|$ESCAPED_REPO_URL|g" ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "PIACA deploy services develop" \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text)

          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "----- SSM STDOUT -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "----- SSM STDERR -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            echo "Deploy dev falhou com status: $STATUS"
            exit 1
          fi

  deploy-prod:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validar configuracao minima (prod)
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "Secret AWS_ACCESS_KEY_ID nao configurado"
            exit 1
          fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Secret AWS_SECRET_ACCESS_KEY nao configurado"
            exit 1
          fi

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy servicos em production via SSM
        run: |
          APP_DIR="${{ secrets.PROD_EC2_APP_DIR }}"
          if [ -z "$APP_DIR" ]; then
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
          fi
          if [ -z "$APP_DIR" ]; then
            APP_DIR="/home/ec2-user/app"
          fi

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=piaca-prod-ec2" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Instancia prod (tag Name=piaca-prod-ec2) nao encontrada em estado running"
            exit 1
          fi

          echo "Aguardando instancia $INSTANCE_ID ficar Online no SSM..."
          for i in $(seq 1 20); do
            PING_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)

            if [ "$PING_STATUS" = "Online" ]; then
              echo "Instancia $INSTANCE_ID esta Online no SSM."
              break
            fi

            if [ "$i" -eq 20 ]; then
              echo "Instancia $INSTANCE_ID nao ficou Online no SSM. Verifique IAM Role (AmazonSSMManagedInstanceCore), SSM Agent e conectividade de saida da EC2."
              exit 1
            fi

            sleep 15
          done

          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cat > ssm-commands.json <<'EOF'
          {"commands":[
            "set -euo pipefail",
            "if [ -z \"${HOME:-}\" ]; then HOME=$(getent passwd \"$(id -u)\" | cut -d: -f6 || true); export HOME; fi",
            "if [ -z \"${HOME:-}\" ]; then HOME=/tmp; export HOME; fi",
            "mkdir -p \"$HOME\"",
            "LOCK_FILE=/tmp/piaca-deploy.lock",
            "exec 9>\"$LOCK_FILE\"",
            "flock -w 600 9 || { echo \"Nao foi possivel adquirir lock de deploy\"; exit 1; }",
            "APP_DIR='__APP_DIR__'",
            "REPO_URL='__REPO_URL__'",
            "TARGET_BRANCH='main'",
            "PARENT_DIR=$(dirname \"$APP_DIR\")",
            "if [ ! -d \"$APP_DIR/.git\" ]; then mkdir -p \"$PARENT_DIR\" && git clone \"$REPO_URL\" \"$APP_DIR\"; fi",
            "cd \"$APP_DIR\"",
            "git config --local --replace-all safe.directory \"$APP_DIR\"",
            "git remote set-url origin \"$REPO_URL\"",
            "git fetch origin \"$TARGET_BRANCH\"",
            "git checkout -B \"$TARGET_BRANCH\" \"origin/$TARGET_BRANCH\"",
            "if [ ! -f \"scripts/deploy-ec2.sh\" ]; then cd /tmp && rm -rf \"$APP_DIR\" && mkdir -p \"$PARENT_DIR\" && git clone --branch \"$TARGET_BRANCH\" --single-branch \"$REPO_URL\" \"$APP_DIR\" && cd \"$APP_DIR\"; fi",
            "if [ ! -f \"scripts/deploy-ec2.sh\" ]; then echo \"scripts/deploy-ec2.sh nao encontrado em $APP_DIR\" && ls -la \"$APP_DIR\" && exit 1; fi",
            "chmod +x scripts/deploy-ec2.sh scripts/sync-env-from-ssm.sh",
            "./scripts/deploy-ec2.sh services main \"$APP_DIR\" docker-compose.yml prod"
          ]}
          EOF

          ESCAPED_APP_DIR=${APP_DIR//&/\\&}
          ESCAPED_REPO_URL=${REPO_URL//&/\\&}
          sed -i "s|__APP_DIR__|$ESCAPED_APP_DIR|g; s|__REPO_URL__|$ESCAPED_REPO_URL|g" ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "PIACA deploy services main" \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text)

          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "----- SSM STDOUT -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "----- SSM STDERR -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            echo "Deploy prod falhou com status: $STATUS"
            exit 1
          fi
