x-db-env: &db-env
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-piaca_db}
  DB_USER: ${DB_USER:-piaca_user}
  DB_PASSWORD: ${DB_PASSWORD:-piaca_pass}

services:
  traefik:
    image: traefik:v3.1
    container_name: piaca-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - 80:80
      - 8080:8080
    volumes:
      - ./piaca-infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./piaca-infra/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - piaca-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: piaca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-piaca_db}
      POSTGRES_USER: ${DB_USER:-piaca_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-piaca_pass}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-piaca_user} -d ${DB_NAME:-piaca_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - piaca-net

  flyway:
    image: flyway/flyway:10
    container_name: piaca-flyway
    command: -url=jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-piaca_db} -user=${DB_USER:-piaca_user} -password=${DB_PASSWORD:-piaca_pass} -connectRetries=30 -locations=filesystem:/flyway/sql migrate
    volumes:
      - ./piaca-backend/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - piaca-net

  example-module:
    build:
      context: ./piaca-backend/example-module
      dockerfile: Dockerfile
    container_name: example-module
    restart: unless-stopped
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      traefik:
        condition: service_healthy
    networks:
      - piaca-net

  piaca-core-auth:
    build:
      context: ./piaca-backend/group-a-core-auth
      dockerfile: Dockerfile
    container_name: piaca-core-auth
    restart: unless-stopped
    environment:
      <<: *db-env
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      traefik:
        condition: service_healthy
    networks:
      - piaca-net

