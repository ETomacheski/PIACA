      - traefik.http.routers.godparenthood.entrypoints=web
      - traefik.http.services.godparenthood.loadbalancer.server.port=3004
      - traefik.http.middlewares.godparenthood-strip.stripprefix.prefixes=/godparenthood
      - traefik.http.routers.godparenthood.middlewares=godparenthood-strip

