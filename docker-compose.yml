version: "3.9"

x-db-env: &db-env
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-piaca_db}
  DB_USER: ${DB_USER:-piaca_user}
  DB_PASSWORD: ${DB_PASSWORD:-piaca_pass}

services:
  traefik:
    image: traefik:v2.11
    container_name: piaca-traefik
    restart: unless-stopped
    command:
      - --log.level=INFO
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=piaca-net
      - --entrypoints.web.address=:80
    ports:
      - 80:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - piaca-net

  postgres:
    image: postgres:16
    container_name: piaca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-piaca_db}
      POSTGRES_USER: ${DB_USER:-piaca_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-piaca_pass}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-piaca_user} -d ${DB_NAME:-piaca_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - piaca-net

  flyway:
    image: flyway/flyway:10
    container_name: piaca-flyway
    command: -url=jdbc:postgresql://${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-piaca_db} -user=${DB_USER:-piaca_user} -password=${DB_PASSWORD:-piaca_pass} -connectRetries=30 -locations=filesystem:/flyway/sql migrate
    volumes:
      - ./piaca-backend/migrations:/flyway/sql
    networks:
      - piaca-net

  example-module:
    build:
      context: ./piaca-backend/example-module
      dockerfile: Dockerfile
    container_name: example-module
    restart: unless-stopped
    environment: *db-env
    networks:
      - piaca-net
    labels:
      - traefik.enable=true
      - traefik.http.routers.example.rule=PathPrefix(`/example`)
      - traefik.http.routers.example.entrypoints=web
      - traefik.http.services.example.loadbalancer.server.port=3005

